name: Eval fixture contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/run_evals.py --mode fixtures --cases evals/cases
      - run: python scripts/run_visual_evals.py --mode fixtures --cases evals/design-cases
      - run: python -m unittest discover -s tests -p 'test_schemas_and_evals.py' -v
      - run: python -m unittest discover -s tests -p 'test_visual_evals.py' -v
