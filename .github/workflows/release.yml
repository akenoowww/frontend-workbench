name: Release preflight

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_repo.py . --release
      - run: python scripts/run_evals.py --cases evals/cases
      - name: Verify tag matches manifest version
        run: test "${GITHUB_REF_NAME}" = "v$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
